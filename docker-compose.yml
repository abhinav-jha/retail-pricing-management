services:

  backend:
    build:
      context: ./backend
    container_name: retail-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://retail_user:retail_password@postgres:5432/retail_pricing
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    container_name: retail-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: retail_pricing
      POSTGRES_USER: retail_user
      POSTGRES_PASSWORD: retail_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: retail-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data: